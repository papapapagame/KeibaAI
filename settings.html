<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PAPAPA IQ KEIBAの設定。AI予想精度・通知・データ更新を管理します。">
  <title>設定 | PAPAPA IQ KEIBA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
  <div class="loading-screen" id="loading-screen" aria-hidden="true">
    <p class="loading-screen__brand">PAPAPA IQ KEIBA</p>
    <p class="loading-screen__text">AI Analyzing...</p>
  </div>

  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <a class="site-header__brand" href="index.html">PAPAPA IQ KEIBA</a>
    <time class="site-header__datetime" id="site-datetime">2026-07-28 00:00</time>
  </header>

  <main class="page page--list page--settings">
    <header class="hero hero--compact">
      <h1 class="title title--page">設定</h1>
      <p class="subtitle subtitle--small">SETTINGS</p>
      <div class="gold-line" aria-hidden="true"></div>
    </header>

    <section class="settings-panel" aria-label="AI設定">
      <h2 class="section-title">AI設定</h2>

      <fieldset class="settings-group">
        <legend class="settings-label">AI予想精度</legend>
        <div class="settings-radio-list">
          <label class="settings-choice">
            <input type="radio" name="ai-precision" value="fast">
            <span>高速</span>
          </label>
          <label class="settings-choice">
            <input type="radio" name="ai-precision" value="standard" checked>
            <span>標準</span>
          </label>
          <label class="settings-choice">
            <input type="radio" name="ai-precision" value="high">
            <span>高精度</span>
          </label>
        </div>
      </fieldset>

      <div class="settings-row">
        <span class="settings-label">期待値重視</span>
        <label class="toggle">
          <input type="checkbox" id="setting-ev" checked>
          <span class="toggle__ui" aria-hidden="true"></span>
          <span class="toggle__text">ON/OFF</span>
        </label>
      </div>

      <div class="settings-row">
        <span class="settings-label">人気順表示</span>
        <label class="toggle">
          <input type="checkbox" id="setting-popularity">
          <span class="toggle__ui" aria-hidden="true"></span>
          <span class="toggle__text">ON/OFF</span>
        </label>
      </div>

      <div class="settings-row">
        <span class="settings-label">穴馬強調表示</span>
        <label class="toggle">
          <input type="checkbox" id="setting-upset" checked>
          <span class="toggle__ui" aria-hidden="true"></span>
          <span class="toggle__text">ON/OFF</span>
        </label>
      </div>

      <div class="settings-row">
        <span class="settings-label">危険人気馬表示</span>
        <label class="toggle">
          <input type="checkbox" id="setting-danger" checked>
          <span class="toggle__ui" aria-hidden="true"></span>
          <span class="toggle__text">ON/OFF</span>
        </label>
      </div>

      <div class="settings-row">
        <span class="settings-label">ダークテーマ</span>
        <label class="toggle" id="dark-theme-toggle">
          <input type="checkbox" id="setting-dark" checked>
          <span class="toggle__ui" aria-hidden="true"></span>
          <span class="toggle__text">ON固定</span>
        </label>
      </div>
    </section>

    <section class="settings-panel" aria-label="通知設定">
      <h2 class="section-title">通知設定</h2>
      <div class="settings-check-list">
        <label class="settings-choice">
          <input type="checkbox" id="notify-ai" checked>
          <span>AI予想完成</span>
        </label>
        <label class="settings-choice">
          <input type="checkbox" id="notify-roi" checked>
          <span>回収率更新</span>
        </label>
        <label class="settings-choice">
          <input type="checkbox" id="notify-grade">
          <span>重賞開催</span>
        </label>
      </div>
    </section>

    <section class="settings-panel" aria-label="データ・その他">
      <h2 class="section-title">データ更新</h2>
      <div class="settings-row settings-row--stack">
        <div>
          <p class="settings-label">最終更新</p>
          <p class="settings-meta" id="last-updated"></p>
        </div>
        <button type="button" class="btn-card" id="update-data">更新する</button>
      </div>

      <div class="settings-actions">
        <button type="button" class="btn-secondary settings-action-btn" id="clear-cache">キャッシュ削除</button>
        <button type="button" class="btn-secondary settings-action-btn" id="show-terms">利用規約</button>
      </div>

      <div class="settings-version">
        <p class="settings-label">バージョン</p>
        <p class="settings-version__name" id="settings-app-name"></p>
        <p class="settings-version__number" id="settings-version"></p>
      </div>
    </section>

    <div class="page-actions page-actions--stack">
      <button type="button" class="btn-primary" id="save-settings">保存</button>
      <a href="performance.html" class="btn-secondary">AI Performance</a>
      <a href="review.html" class="btn-secondary">AI Race Review</a>
      <a href="balance.html" class="btn-secondary" id="back-to-balance">収支管理へ戻る</a>
      <a href="index.html" class="btn-secondary">トップへ戻る</a>
    </div>
  </main>

  <footer class="site-footer">
    <p>©2026 PAPAPA IQ KEIBA</p>
    <p>Version 10.6.0 · Production Integration</p>
  </footer>

  <button type="button" class="scroll-top" id="scroll-top" aria-label="ページ上部へ">↑</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
