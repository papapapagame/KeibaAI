<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PAPAPA IQ KEIBAの買い目生成。AI推奨券種・買い目・資金配分を提案します。">
  <title>買い目生成 | PAPAPA IQ KEIBA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
  <div class="loading-screen" id="loading-screen" aria-hidden="true">
    <p class="loading-screen__brand">PAPAPA IQ KEIBA</p>
    <p class="loading-screen__text">AI Analyzing...</p>
  </div>

  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <a class="site-header__brand" href="index.html">PAPAPA IQ KEIBA</a>
    <time class="site-header__datetime" id="site-datetime">2026-07-28 00:00</time>
  </header>

  <main class="page page--list page--ticket">
    <header class="hero hero--compact">
      <h1 class="title title--page">買い目生成</h1>
      <p class="subtitle subtitle--small">BUY TICKET</p>
      <div class="gold-line" aria-hidden="true"></div>
    </header>

    <section class="ticket-section" aria-label="AI推奨券種">
      <h2 class="section-title">AI推奨券種</h2>
      <div class="ticket-type-list" id="ticket-type-list" role="group" aria-label="券種選択">
        <button type="button" class="ticket-type-btn" data-type="三連単">三連単</button>
        <button type="button" class="ticket-type-btn is-active" data-type="三連複">三連複</button>
        <button type="button" class="ticket-type-btn" data-type="馬連">馬連</button>
        <button type="button" class="ticket-type-btn" data-type="ワイド">ワイド</button>
        <button type="button" class="ticket-type-btn" data-type="単勝">単勝</button>
      </div>
    </section>

    <section class="ticket-section" aria-label="AI推奨買い目">
      <h2 class="section-title">AI推奨買い目</h2>
      <div class="ticket-bet-list" id="ticket-bet-list">
        <!-- script.js -->
      </div>
    </section>

    <section class="ticket-section fund-panel" aria-label="資金入力">
      <h2 class="section-title">資金入力</h2>

      <div class="field">
        <label for="purchase-amount">購入金額</label>
        <div class="amount-input-row">
          <input type="number" id="purchase-amount" name="purchase-amount" value="1000" min="100" step="100">
          <span class="amount-unit">円</span>
        </div>
      </div>

      <div class="fund-recommend">
        <p class="fund-recommend__label">おすすめ配分</p>
        <p class="fund-recommend__value" id="fund-allocation">各100円</p>
      </div>

      <div class="fund-summary">
        <div class="fund-summary__item">
          <span class="fund-summary__label">合計金額</span>
          <span class="fund-summary__value" id="fund-total">1,000円</span>
        </div>
        <div class="fund-summary__item">
          <span class="fund-summary__label">期待払戻</span>
          <span class="fund-summary__value" id="fund-payout">8,500円</span>
        </div>
        <div class="fund-summary__item">
          <span class="fund-summary__label">期待利益</span>
          <span class="fund-summary__value fund-summary__value--profit" id="fund-profit">+7,500円</span>
        </div>
        <div class="fund-summary__item">
          <span class="fund-summary__label">期待回収率</span>
          <span class="fund-summary__value" id="fund-roi">850%</span>
        </div>
      </div>
    </section>

    <section class="ai-comment-card" aria-label="AIコメント">
      <h2 class="section-title">AIコメント</h2>
      <p class="ai-comment-card__text" id="ticket-ai-comment">
        三連複が最も期待値が高い構成です。<br><br>
        本命馬を軸に<br>
        穴馬候補を組み合わせています。
      </p>
    </section>

    <div class="page-actions page-actions--stack">
      <button type="button" class="btn-primary" id="save-ticket">保存する</button>
      <button type="button" class="btn-secondary" id="go-ledger">収支管理へ</button>
      <a href="analysis.html" class="btn-secondary" id="back-to-analysis">AI分析へ戻る</a>
    </div>
  </main>

  <footer class="site-footer">
    <p>©2026 PAPAPA IQ KEIBA</p>
    <p>Version 0.9.0</p>
  </footer>

  <button type="button" class="scroll-top" id="scroll-top" aria-label="ページ上部へ">↑</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
